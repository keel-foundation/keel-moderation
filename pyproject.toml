[project]
name = "keel-moderation"
version = "0.1.0"
description = "KeelTube moderation, appeals, audit ledger, and content protection service"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
model = [
  "transformers>=4.40",
  "torch>=2.3",
]
dev = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "referencing>=0.35",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
